---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The semrel Authors
# yaml-language-server: $schema=https://semrel.io/schema/v1.json
schemaVersion: 1

tagPrefix: "v"
commit_changelog: true
tag_exists_strategy: update-changelog

# semrel uses itself to manage this plugin's releases.
# version_ceiling keeps releases in 0.x.x until deliberately promoted to 1.0.0.
# To release 1.0.0: remove version_ceiling and commit.

version_ceiling: "1.0.0"
ceiling_strategy: clamp

branches:
  - name: main

rules:
    - type: feat
      bump: minor
    - type: fix
      bump: patch
    - type: perf
      bump: patch
    - type: revert
      bump: patch
    - type: deps
      bump: patch

plugins:
  - uses: "@semrel/condition-github-actions"
    phase: condition
  - uses: "@semrel/generator-changelog-md"
    phase: pre-tag
    args:
      keep_releases: "10"
  - uses: "@semrel/provider-github"
    phase: release
    args:
      draft: "false"
      prerelease: "false"

...
